openapi: 3.0.3
info:
  title: TTRPG Helper Backend API
  version: 1.0.0
  description: Minimal API for importing/exporting whole JSON files used by the frontend.
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/import:
    post:
      summary: Import a whole JSON document
      description: Accepts `application/json` body and optional `filename` query parameter. The payload is validated against the server schema and stored server-side.
      parameters:
        - in: query
          name: filename
          schema:
            type: string
          description: Optional desired filename for storing the JSON (will be sanitized).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  path:
                    type: string
        '400':
          description: Validation failed
        '413':
          description: Payload too large
  /api/export:
    get:
      summary: Export a stored JSON document
      description: Retrieves a previously stored JSON document by its `id` query parameter.
      parameters:
        - in: query
          name: filename
          schema:
            type: string
          required: true
          description: The unique identifier of the JSON document to export.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not found
